---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: harbor-registry-to-external-home
spec:
  sourcePVC: harbor-registry-data
  trigger:
    schedule: "15 9 * * *"
  restic:
    copyMethod: Snapshot
    pruneIntervalDays: 7
    repository: harbor-registry-external-home-restic-config
    volumeSnapshotClassName: csi-rbdplugin-snapclass
    storageClassName: ceph-block
    moverResources:
      requests:
        cpu: 50m
        memory: 512Mi
    retain:
      daily: 3
