---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: clamav-mirror
  labels:
    app.kubernetes.io/name: clamav-mirror
    app.kubernetes.io/part-of: clamav
spec:
  # cvdupdate is one of the two clients the ClamAV CDN sanctions; it keeps
  # local state on the PVC so refreshes are incremental. Everything inside
  # the cluster (freshclam in the clamd pod) pulls from the Nexus repo only.
  schedule: "17 */4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 2400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: clamav-mirror
        spec:
          restartPolicy: Never
          containers:
            - name: mirror
              image: python:3.12-slim
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  export HOME=/state
                  pip install --quiet --no-cache-dir cvdupdate
                  cvd config set --dbdir /state/db
                  cvd update
                  python3 - <<'EOF'
                  import base64, os, pathlib, urllib.request
                  url = os.environ["NEXUS_URL"].rstrip("/")
                  auth = base64.b64encode(
                      f"{os.environ['NEXUS_USER']}:{os.environ['NEXUS_PASS']}".encode()
                  ).decode()
                  for p in sorted(pathlib.Path("/state/db").iterdir()):
                      if not p.is_file():
                          continue
                      req = urllib.request.Request(
                          f"{url}/{p.name}",
                          data=p.read_bytes(),
                          method="PUT",
                          headers={"Authorization": f"Basic {auth}"},
                      )
                      with urllib.request.urlopen(req) as resp:
                          print(p.name, resp.status)
                  EOF
              env:
                - name: NEXUS_URL
                  value: http://nexus.development.svc.cluster.local:8081/repository/clamav-signatures
              envFrom:
                - secretRef:
                    name: clamav-mirror-nexus
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 1Gi
              volumeMounts:
                - name: state
                  mountPath: /state
          volumes:
            - name: state
              persistentVolumeClaim:
                claimName: clamav-mirror-state
