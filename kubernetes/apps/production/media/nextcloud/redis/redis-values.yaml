---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: redis
spec:
  values:
    architecture: standalone
    auth:
      enabled: true
      # the kustomization's namePrefix turns redis-auth into nextcloud-redis-auth
      existingSecret: nextcloud-redis-auth
      existingSecretPasswordKey: redis-password
    networkPolicy:
      # only pods labelled nextcloud-redis-client: "true" may connect
      allowExternal: false
    master:
      replicaCount: 1
      persistence:
        size: 8Gi
        storageClass: ceph-block
      resources:
        requests:
          memory: 256Mi
          cpu: 100m
        limits:
          memory: 512Mi
    metrics:
      enabled: false
