---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: finance-vis
spec:
  values:
    defaultPodOptions:
      imagePullSecrets:
        - name: harbor-global-ro
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    controllers:
      finance-vis:
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: harbor.${SECRET_DOMAIN}/finance-vis/finance-vis
              tag: "0.1.0"
              pullPolicy: IfNotPresent
            env:
              TZ: America/Los_Angeles
              ORIGIN: https://finance-vis.${SECRET_DOMAIN}
              FIREFLY_URL: http://firefly-iii.finance.svc.cluster.local
              SYNC_SCHEDULE: "0 2 * * *"
            envFrom:
              - secretRef:
                  name: finance-vis-secrets # FIREFLY_TOKEN
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 3000
                  periodSeconds: 5
                  failureThreshold: 2
              startup:
                enabled: true
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
    service:
      app:
        controller: finance-vis
        ports:
          http:
            port: 3000
    persistence:
      data:
        type: emptyDir
        globalMounts:
          - path: /app/data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
