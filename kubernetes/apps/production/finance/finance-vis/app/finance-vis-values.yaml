---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: finance-vis
spec:
  values:
    defaultPodOptions:
      imagePullSecrets:
        - name: harbor-global-ro
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    controllers:
      finance-vis:
        strategy: RollingUpdate
        containers:
          app:
            image: &image
              repository: harbor.${SECRET_DOMAIN}/finance-vis/finance-vis
              tag: "0.2.0"
              pullPolicy: IfNotPresent
            env:
              TZ: America/Los_Angeles
              ORIGIN: https://finance-vis.${SECRET_DOMAIN}
              FIREFLY_URL: http://firefly-iii.finance.svc.cluster.local
              SYNC_SCHEDULE: "0 2 * * *"
            envFrom:
              - secretRef:
                  name: finance-vis-secrets # FIREFLY_TOKEN
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 3000
                  periodSeconds: 5
                  failureThreshold: 2
              startup:
                enabled: true
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 512Mi
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
          mcp:
            image: *image
            command: ["node", "src/mcp/server.ts"]
            env:
              TZ: America/Los_Angeles
              MCP_PORT: "3001"
              MCP_PUBLIC_URL: https://finance-mcp.${SECRET_DOMAIN}
              MCP_OIDC_ISSUER: https://id.${SECRET_DOMAIN}/application/o/finance-mcp/
              MCP_OIDC_CLIENT_ID: finance-mcp
              MCP_ALLOWED_USERS: "neil"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 3001
                  periodSeconds: 30
                  failureThreshold: 3
              readiness:
                enabled: false
              startup:
                enabled: false
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 384Mi
            securityContext: *securityContext
    service:
      app:
        controller: finance-vis
        ports:
          http:
            port: 3000
          mcp:
            port: 3001
    persistence:
      data:
        type: emptyDir
        advancedMounts:
          finance-vis:
            app:
              - path: /app/data
            mcp:
              - path: /app/data
                readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
