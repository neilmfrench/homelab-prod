---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps-campquest-v2
  namespace: flux-system
spec:
  path: ./kubernetes/apps/production/campsearch/campquest-v2/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab-source
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: campquest-v2
      namespace: campsearch
  interval: 30m
  retryInterval: 1m
  timeout: 10m
