---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: campquest-v2
spec:
  values:
    defaultPodOptions:
      imagePullSecrets:
        - name: harbor-global-ro
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    controllers:
      main:
        type: statefulset
        containers:
          main:
            image:
              repository: harbor.${SECRET_DOMAIN}/campsearch/campquest-v2
              tag: "0.1.0"
              pullPolicy: IfNotPresent
            args:
              - "serve"
              - "--http=0.0.0.0:8090"
              - "--dir=/app/pb_data"
              - "--encryptionEnv=PB_ENCRYPTION_KEY"
            env:
              TZ: America/Los_Angeles
            envFrom:
              - secretRef:
                  name: campquest-v2-secrets
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
            resources:
              requests:
                cpu: 100m
                memory: 384Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
    service:
      main:
        enabled: true
        ports:
          http:
            enabled: true
            port: 8090
    ingress:
      main:
        enabled: true
        className: "traefik"
        hosts:
          - host: &host "campquest.${SECRET_DOMAIN}"
            paths:
              - path: /
                type: Prefix
                service:
                  name: main
        tls:
          - hosts:
              - *host
    persistence:
      data:
        enabled: true
        existingClaim: campquest-v2-data
        globalMounts:
          - path: /app/pb_data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
