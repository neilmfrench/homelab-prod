apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: podinfo
spec:
  values:
    ingress:
      enabled: true
      # LAN-only demo app: no external-dns annotations, so it never gets a public DNS record
      # and never opts into the websecure entrypoint.
      hosts:
        - host: &host "podinfo-hb.${SECRET_DOMAIN}"
          paths:
            - path: /
              pathType: Prefix
      tls:
        - hosts:
            - *host
