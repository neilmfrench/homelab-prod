---
apiVersion: kueue.x-k8s.io/v1beta1
kind: ResourceFlavor
metadata:
  name: default-flavor
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: ClusterQueue
metadata:
  name: cluster-queue
spec:
  namespaceSelector: {} # admit workloads from any namespace
  resourceGroups:
    - coveredResources: ["cpu", "memory", "ephemeral-storage"]
      flavors:
        - name: default-flavor
          resources:
            - name: cpu
              nominalQuota: "8"
            - name: memory
              nominalQuota: 16Gi
            # Jenkins agent pods (dynamic_agent) request ephemeral-storage on
            # every container; a ClusterQueue that doesn't cover the resource
            # can never admit them ("resource ephemeral-storage unavailable").
            - name: ephemeral-storage
              nominalQuota: 500Gi
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: LocalQueue
metadata:
  name: default-queue
  namespace: development
spec:
  clusterQueue: cluster-queue
